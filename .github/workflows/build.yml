name: Build CUE Sampler

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # JUCE / Bungee / ONNX are pulled by CMake FetchContent, not submodules,
        # so no submodule checkout is needed.

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The stem-separation model is gitignored (316 MB, far over GitHub's 100 MB
      # file limit), so a clean CI checkout has no assets/htdemucs/htdemucs.onnx.
      # Without it the Windows installer still builds, but silently ships with
      # stem separation disabled (see make-installer-windows.ps1). Restore it
      # from cache when we can; the download script verifies the pinned SHA-256
      # either way and is a no-op when the file is already correct.
      - name: Cache HTDemucs model (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: assets/htdemucs/htdemucs.onnx
          key: htdemucs-68d0bf16428ef66e692cdff8a9ccf28f1ef3f69440d57e58605a4cc55fcc5e74

      # Must run BEFORE Configure: CMakeLists.txt tests EXISTS on the model at
      # configure time to wire up its LINK_DEPENDS staging rule, so fetching it
      # after configuring would leave the bundle model-less.
      - name: Fetch HTDemucs model (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\download-htdemucs-model.ps1

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCUE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      # CI cannot use make-installer-windows.ps1 -CommercialRelease (that mode
      # also demands an Authenticode cert, which no runner has), so assert the
      # staging result directly. This is what keeps "installer quietly loses
      # stem separation" from regressing unnoticed.
      - name: Verify stem model staged into VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $model = "build\CueSampler_artefacts\Release\VST3\CUE SAMPLER.vst3\Contents\x86_64-win\htdemucs\htdemucs.onnx"
          if (-not (Test-Path $model -PathType Leaf)) {
            Write-Error "Stem model was not staged into the VST3 bundle: $model"
          }
          $size = (Get-Item $model).Length
          if ($size -ne 316446953) {
            Write-Error "Staged stem model is $size bytes; expected 316446953."
          }
          Write-Host "Stem model staged and sized correctly: $size bytes"

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis.install --version=3.12 --yes --no-progress

      - name: Build NSIS Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\make-installer-windows.ps1 -BuildDir "build"

      - name: List build artefacts
        shell: bash
        run: find build/CueSampler_artefacts -maxdepth 4 -name "*.vst3" -o -name "*.component" -o -name "*.exe" -o -name "*.app" 2>/dev/null || true

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: cue-sampler-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/CueSampler_artefacts/Release/VST3/**
            !build/CueSampler_artefacts/Release/VST3/**/htdemucs/**
            build/CueSampler_artefacts/Release/AU/**
            build/CueSampler_artefacts/Release/Standalone/**
            dist/**
